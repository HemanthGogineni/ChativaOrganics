<!-- Contact Start -->
<div class="container-xxl py-6">
  <div class="container">
    <div class="section-header text-center mx-auto mb-5" style="max-width: 600px;">
      <h2 class="mb-3">Contact Us</h2>
      <p class="text-muted-2">We serve 24/7 online. Reach out for any requirements — we’re happy to help.</p>
    </div>

    <div class="row g-5 justify-content-center">
      <!-- Contact Details -->
      <div class="col-lg-5 col-md-12">
        <div class="surface rounded-xl p-4 p-xl-5 h-100">
          <h5 class="mb-4">Get In Touch</h5>

          <div class="d-flex align-items-start gap-3 mb-4">
            <div class="btn btn-outline-success btn-sm-square rounded-circle" aria-hidden="true">
              <i class="fa fa-map-marker-alt"></i>
            </div>
            <div>
              <div class="fw-semibold">Store Address</div>
              <div>16-18-64, Salt Bazar, near Vyshnavi Jewellers, Revenue ward 9, Tenali, 522201</div>
            </div>
          </div>

          <div class="d-flex align-items-start gap-3 mb-4">
            <div class="btn btn-outline-success btn-sm-square rounded-circle" aria-hidden="true">
              <i class="fa fa-phone-alt"></i>
            </div>
            <div>
              <div class="fw-semibold">Call Us</div>
              <div>+91 9154850295</div>
            </div>
          </div>

          <div class="d-flex align-items-start gap-3 mb-4">
            <div class="btn btn-outline-success btn-sm-square rounded-circle" aria-hidden="true">
              <i class="fa fa-envelope"></i>
            </div>
            <div>
              <div class="fw-semibold">Email Us</div>
              <div>info&#64;chaitvaorganics.com</div>
            </div>
          </div>

          <div>
            <div class="fw-semibold mb-2">Follow Us</div>
            <a class="text-decoration-none" target="_blank"
               href="https://www.instagram.com/chaitva_organics_?igsh=ZnduYTY4bjd5bW95">
              <i class="fab fa-instagram me-2"></i>@chaitva_organics_
            </a>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="col-lg-7 col-md-12">
        <div class="surface rounded-xl p-4 p-xl-5 h-100">
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="text" class="form-control" id="name" placeholder="Your Name" />
                  <label for="name">Your Name</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating">
                  <input type="email" class="form-control" id="email" placeholder="Your Email" />
                  <label for="email">Your Email</label>
                </div>
              </div>
              <div class="col-12">
                <div class="form-floating">
                  <input type="text" class="form-control" id="subject" placeholder="Subject" />
                  <label for="subject">Subject</label>
                </div>
              </div>
              <div class="col-12">
                <div class="form-floating">
                  <textarea class="form-control" placeholder="Leave a message here" id="message" style="height: 200px"></textarea>
                  <label for="message">Message</label>
                </div>
              </div>
              <div class="col-12">
                <button class="btn btn-primary rounded-pill py-3 px-5" type="submit">Send Message</button>
              </div>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
